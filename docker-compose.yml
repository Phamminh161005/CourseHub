name: diagramio

services:
  postgres:
    image: postgres:15-alpine
    container_name: diagramio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-diagram_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-diagram_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diagramio

volumes:
  postgres_data:

networks:
  diagramio:
    driver: bridge