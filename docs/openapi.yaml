openapi: 3.1.0
info:
  description: "REST API cho dịch vụ vẽ sơ đồ UML/ERD trực tuyến. Đăng nhập lấy access\
    \ token (bearerAuth), hoặc dùng token của link chia sẻ qua header X-Share-Token\
    \ (shareToken) để xem/sửa sơ đồ được chia sẻ."
  title: DiagramIO API
  version: v1
servers:
- description: Cùng host với Swagger UI
  url: /
security:
- bearerAuth: []
- shareToken: []
tags:
- description: "Quản lý sơ đồ UML/ERD: tạo, xem, sửa (optimistic locking), xóa"
  name: Diagrams
- description: Quản lý liên kết và quyền chia sẻ sơ đồ (Dành cho Chủ sở hữu)
  name: Diagram Sharing
- description: Lịch sử phiên bản (snapshot bất biến) và khôi phục sơ đồ
  name: Diagram versions
- description: Trạng thái dịch vụ
  name: System
- description: Truy xuất sơ đồ công khai thông qua mã chia sẻ (Không yêu cầu đăng
    nhập)
  name: Public Sharing
- description: "Đăng ký, đăng nhập, refresh token, đăng xuất"
  name: Auth
- description: Tài khoản của người đang đăng nhập
  name: Users
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Cặp access token và refresh token
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Thiếu email hoặc mật khẩu
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sai email hoặc mật khẩu
      security: []
      summary: "Đăng nhập bằng email/mật khẩu, cấp access token và refresh token"
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "204":
          description: Đã thu hồi refresh token
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Thiếu refresh token
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập (chỉ cầm token chia sẻ là chưa đủ)
      security:
      - bearerAuth: []
      summary: Thu hồi refresh token hiện tại
      tags:
      - Auth
  /api/v1/auth/refresh-token:
    post:
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Cặp token mới
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Thiếu refresh token
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Refresh token sai, hết hạn hoặc đã dùng"
      security: []
      summary: Đổi refresh token lấy cặp token mới (token cũ bị thu hồi)
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Đã tạo tài khoản
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Thiếu trường, email sai định dạng, mật khẩu ngoài 8-72 ký\
            \ tự"
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Email hoặc username đã tồn tại
      security: []
      summary: Đăng ký tài khoản mới
      tags:
      - Auth
  /api/v1/diagrams:
    get:
      description: "Lọc theo loại (UML/ERD), tìm theo tên, phân trang (size tối đ\
        a 100)."
      operationId: getMyDiagrams
      parameters:
      - description: Tìm theo tên (không phân biệt hoa thường)
        in: query
        name: title
        required: false
        schema:
          type: string
      - description: UML hoặc ERD
        in: query
        name: diagramType
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseDiagramSummaryResponse"
          description: Một trang danh sách sơ đồ (không kèm data)
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Dữ liệu không hợp lệ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
      security:
      - bearerAuth: []
      summary: Danh sách sơ đồ của tôi
      tags:
      - Diagrams
    post:
      description: "Sơ đồ mới luôn riêng tư, data mặc định {\"nodes\": [], \"edges\"\
        : []}. Người tạo là owner."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiagramRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiagramResponse"
          description: Đã tạo sơ đồ
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Dữ liệu không hợp lệ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
      security:
      - bearerAuth: []
      summary: Tạo sơ đồ mới
      tags:
      - Diagrams
  /api/v1/diagrams/public:
    get:
      description: Không cần đăng nhập.
      operationId: getPublicDiagrams
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseDiagramSummaryResponse"
          description: Một trang danh sách sơ đồ công khai (không kèm data)
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Dữ liệu không hợp lệ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
      security: []
      summary: Danh sách sơ đồ công khai
      tags:
      - Diagrams
  /api/v1/diagrams/{id}:
    delete:
      description: Chỉ owner.
      operationId: delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Đã xóa
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Dữ liệu không hợp lệ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không phải owner
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ
      security:
      - bearerAuth: []
      summary: Xóa sơ đồ
      tags:
      - Diagrams
    get:
      description: "Sơ đồ công khai: ai cũng xem được. Riêng tư: owner hoặc người\
        \ có link chia sẻ (view/edit)."
      operationId: getById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiagramResponse"
          description: Chi tiết sơ đồ
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Dữ liệu không hợp lệ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không có quyền xem
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ
      summary: Chi tiết sơ đồ kèm data
      tags:
      - Diagrams
    put:
      description: "Owner hoặc người có link edit. Bắt buộc gửi version đang thấy;\
        \ lệch thì 409. data phải là object có mảng nodes và edges, tối đa 2 MB. Chỉ\
        \ owner đổi được isPublic."
      operationId: update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiagramRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiagramResponse"
          description: "Đã cập nhật, version tăng 1"
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Dữ liệu không hợp lệ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không có quyền sửa
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Sơ đồ đã bị người khác sửa (version lệch)
      summary: Cập nhật sơ đồ
      tags:
      - Diagrams
  /api/v1/diagrams/{id}/shares:
    get:
      description: Chỉ chủ sở hữu (Owner) mới có quyền truy cập.
      operationId: getShares
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareResponse"
          description: Các liên kết chia sẻ của sơ đồ
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không phải chủ sở hữu sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc liên kết chia sẻ
      security:
      - bearerAuth: []
      summary: Danh sách liên kết chia sẻ của sơ đồ
      tags:
      - Diagram Sharing
    post:
      description: Tạo liên kết chia sẻ với quyền view (chỉ xem) hoặc edit (chỉnh
        sửa). Chỉ chủ sở hữu mới có quyền.
      operationId: createShare
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
          description: "Đã tạo liên kết, kèm shareToken và shareUrl"
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: role không phải view/edit
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không phải chủ sở hữu sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc liên kết chia sẻ
      security:
      - bearerAuth: []
      summary: Tạo liên kết chia sẻ mới
      tags:
      - Diagram Sharing
  /api/v1/diagrams/{id}/shares/{share_id}:
    delete:
      description: Vô hiệu hóa liên kết chia sẻ ngay lập tức. Chỉ chủ sở hữu mới có
        quyền.
      operationId: revokeShare
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: share_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: "Đã thu hồi, token mất hiệu lực ngay"
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không phải chủ sở hữu sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc liên kết chia sẻ
      security:
      - bearerAuth: []
      summary: Thu hồi liên kết chia sẻ
      tags:
      - Diagram Sharing
    patch:
      description: Đổi mức quyền (view <-> edit). Chỉ chủ sở hữu mới có quyền.
      operationId: updateShare
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: share_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShareRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareResponse"
          description: Đã đổi quyền
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: role không phải view/edit
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không phải chủ sở hữu sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc liên kết chia sẻ
      security:
      - bearerAuth: []
      summary: Thay đổi mức độ quyền chia sẻ
      tags:
      - Diagram Sharing
  /api/v1/diagrams/{id}/versions:
    get:
      description: Owner hoặc người có link chia sẻ view/edit.
      operationId: list
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagramVersionSummaryResponse"
          description: Danh sách phiên bản
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không đủ quyền với sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc phiên bản
      summary: Danh sách phiên bản đã lưu (mới nhất trước)
      tags:
      - Diagram versions
    post:
      description: Owner hoặc editor.
      operationId: create_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionRequest"
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiagramVersionResponse"
          description: Đã tạo phiên bản
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Ghi chú quá 255 ký tự
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không đủ quyền với sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc phiên bản
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Sơ đồ đã bị sửa sau version client gửi lên, hoặc có phiên\
            \ bản khác được lưu cùng lúc; tải lại rồi thử lại"
      summary: Lưu snapshot dữ liệu hiện tại kèm ghi chú
      tags:
      - Diagram versions
  /api/v1/diagrams/{id}/versions/{version_id}:
    get:
      description: Owner hoặc người có link chia sẻ view/edit.
      operationId: get
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: version_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiagramVersionResponse"
          description: Chi tiết phiên bản
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không đủ quyền với sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc phiên bản
      summary: Chi tiết cấu trúc JSON của một phiên bản
      tags:
      - Diagram versions
  /api/v1/diagrams/{id}/versions/{version_id}/restore:
    post:
      description: Owner hoặc editor. Trạng thái hiện tại được tự động lưu thành một
        snapshot sao lưu trước khi ghi đè; version của sơ đồ tăng thêm 1.
      operationId: restore
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: version_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RestoreVersionResponse"
          description: Đã khôi phục
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không đủ quyền với sơ đồ
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Không tìm thấy sơ đồ hoặc phiên bản
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Sơ đồ vừa bị người khác cập nhật, thử lại"
      summary: Khôi phục sơ đồ về phiên bản đã chọn
      tags:
      - Diagram versions
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
          description: Dịch vụ và CSDL hoạt động
        "503":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
          description: Mất kết nối CSDL
      security: []
      summary: Kiểm tra dịch vụ và kết nối CSDL
      tags:
      - System
  /api/v1/shares/{token}:
    get:
      description: Ai có token hợp lệ đều có thể xem cấu trúc sơ đồ và quyền tương
        ứng (view/edit).
      operationId: getSharedDiagram
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SharedDiagramResponse"
          description: Sơ đồ và quyền của token (view/edit)
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token không tồn tại hoặc đã bị thu hồi
      security: []
      summary: Truy xuất thông tin và cấu trúc sơ đồ qua token chia sẻ
      tags:
      - Public Sharing
  /api/v1/users/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Thông tin tài khoản
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập (chỉ cầm token chia sẻ là chưa đủ)
      security:
      - bearerAuth: []
      summary: Lấy thông tin cá nhân
      tags:
      - Users
  /api/v1/users/me/password:
    patch:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Đã đổi mật khẩu
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Mật khẩu cũ sai hoặc mật khẩu mới ngoài 8-72 ký tự
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Chưa đăng nhập (chỉ cầm token chia sẻ là chưa đủ)
      security:
      - bearerAuth: []
      summary: Đổi mật khẩu (yêu cầu mật khẩu cũ)
      tags:
      - Users
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 255
          minLength: 1
        newPassword:
          type: string
          maxLength: 72
          minLength: 8
    CreateDiagramRequest:
      type: object
      properties:
        diagramType:
          type: string
          pattern: UML|ERD
        title:
          type: string
          maxLength: 255
          minLength: 1
      required:
      - diagramType
    CreateShareRequest:
      type: object
      properties:
        role:
          type: string
          description: "Quyền hạn chia sẻ: view (chỉ xem) hoặc edit (chỉnh sửa)"
          enum:
          - view
          - edit
          example: view
      required:
      - role
    CreateVersionRequest:
      type: object
      properties:
        note:
          type: string
          description: Ghi chú phiên bản
          example: Bản thiết kế ERD Pha 1
          maxLength: 255
          minLength: 0
        version:
          type: integer
          format: int32
          description: "Version sơ đồ client đang thấy (không bắt buộc). Lệch với\
            \ hiện tại thì 409, tránh chụp nhầm nội dung người khác vừa sửa"
          example: 6
    DiagramResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          example:
            nodes: []
            edges: []
        diagramType:
          type: string
        id:
          type: string
          format: uuid
        isPublic:
          type: boolean
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
    DiagramSummaryResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        diagramType:
          type: string
        id:
          type: string
          format: uuid
        isPublic:
          type: boolean
        ownerId:
          type: string
          format: uuid
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
    DiagramVersionResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        data:
          type: object
          example:
            nodes: []
            edges: []
        diagramId:
          type: string
          maxLength: 255
          minLength: 1
        diagramType:
          type: string
          format: uuid
        note:
          type: string
        versionNumber:
          type: integer
          format: int32
    DiagramVersionSummaryResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        note:
          type: string
        versionNumber:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        path:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    PageResponseDiagramSummaryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/DiagramSummaryResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        username:
          type: string
          maxLength: 50
          minLength: 0
    RestoreVersionResponse:
      type: object
      properties:
        backupVersion:
          $ref: "#/components/schemas/DiagramVersionSummaryResponse"
        data:
          type: object
          example:
            nodes: []
            edges: []
        diagramId:
          type: string
          format: uuid
        diagramType:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
    ShareResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: Thời gian tạo liên kết
        diagramId:
          type: string
          format: uuid
          description: Mã định danh sơ đồ
        id:
          type: string
          format: uuid
          description: Mã định danh liên kết chia sẻ
        role:
          type: string
          description: Quyền hạn chia sẻ (view hoặc edit)
        shareToken:
          type: string
          description: "Mã token chia sẻ bảo mật, gửi qua header X-Share-Token khi\
            \ gọi /api/v1/diagrams/{id}..."
        shareUrl:
          type: string
          description: "Đường dẫn chia sẻ chứa token, mở là xem được sơ đồ"
          example: http://localhost:8080/api/v1/shares/3f9a1c...
    SharedDiagramResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: Thời gian tạo
        data:
          type: object
          description: Cấu trúc dữ liệu các node và edge của sơ đồ
          example:
            nodes: []
            edges: []
        diagramType:
          type: string
          description: Loại sơ đồ (UML hoặc ERD)
        id:
          type: string
          format: uuid
          description: Mã định danh sơ đồ
        isPublic:
          type: boolean
          description: Trạng thái công khai
        role:
          type: string
          description: Quyền hạn của token truy cập này (view hoặc edit)
        title:
          type: string
          description: Tiêu đề sơ đồ
        updatedAt:
          type: string
          format: date-time
          description: Thời gian cập nhật gần nhất
        version:
          type: integer
          format: int32
          description: Phiên bản sơ đồ
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
    UpdateDiagramRequest:
      type: object
      properties:
        data:
          type: object
          example:
            nodes: []
            edges: []
        diagramType:
          type: string
          pattern: UML|ERD
        isPublic:
          type: boolean
        title:
          type: string
          maxLength: 255
          minLength: 1
        version:
          type: integer
          format: int32
      required:
      - data
      - diagramType
      - version
    UpdateShareRequest:
      type: object
      properties:
        role:
          type: string
          description: "Mức độ quyền chia sẻ mới: view (chỉ xem) hoặc edit (chỉnh\
            \ sửa)"
          enum:
          - view
          - edit
          example: edit
      required:
      - role
    UserResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
          format: uuid
        username:
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    shareToken:
      description: "Token của link chia sẻ (view/edit), lấy từ POST /api/v1/diagrams/{id}/shares"
      in: header
      name: X-Share-Token
      type: apiKey
